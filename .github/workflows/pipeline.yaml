# This workflow is triggered when a new Git tag is pushed to the repository.
name: Push Docker image on new tag

on:
  push:
    # This section configures the trigger to run only for pushed tags.
    # The '*' is a wildcard that matches any tag name (e.g., 1.0.0, v2.1.0, etc.).
    tags:
      - '*'

jobs:
  push_to_registry:
    name: Push Docker image to Docker Hub
    runs-on: ubuntu-latest
    steps:
      # Step 1: Check out the repository's code so the workflow can access it.
      - name: Check out the repo
        uses: actions/checkout@v2

      # Step 2: Log in to Docker Hub using secrets stored in your repository settings.
      # This is required to push images to your Docker Hub account.
      - name: Log in to Docker Hub
        uses: docker/login-action@v1
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_ACCESS_TOKEN }}

      # Step 3: This is a powerful action that handles both building and pushing the image.
      # It uses the Git tag from the push event to tag the Docker image.
      - name: Build and push Docker image
        uses: docker/build-push-action@v2
        with:
          # 'context: .' tells the action to use the Dockerfile in the root of the repository.
          context: .
          # 'push: true' instructs the action to push the image after a successful build.
          push: true
          # 'tags:' defines the tags for the Docker image.
          # We use github.ref_name which automatically contains the name of the tag that triggered the workflow.
          # We also add a 'latest' tag, which is a common convention for the most recent release.
          tags: |
            devlopesbernardo/hello-world-go:${{ github.ref_name }}
